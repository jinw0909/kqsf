<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{site/layout/base :: head('준비중입니다 | KQSF', '/site/css/home.css')}"></head>
<link rel="stylesheet" th:href="@{/site/css/site.css}">
<body>
<header th:replace="~{site/layout/base :: header}"></header>

<main class="system-page">
  <section class="system-card">
    <p class="section-eyebrow" th:text="${eyebrow} ?: 'Coming Soon'">Coming Soon</p>

    <h1 th:text="${title} ?: '준비중입니다.'">준비중입니다.</h1>

    <p th:text="${message} ?: '현재 해당 페이지는 준비중입니다.'">
      현재 해당 페이지는 준비중입니다.
    </p>

    <div class="system-actions">
      <a href="/" class="button button--primary">홈으로 돌아가기</a>
      <a href="/products" class="button button--outline">제품 보기</a>
    </div>
  </section>
</main>

<footer th:replace="~{site/layout/base :: footer}"></footer>
<th:block th:replace="~{site/layout/base :: scripts}"></th:block>
</body>
</html>
